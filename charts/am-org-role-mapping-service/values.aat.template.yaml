java:
#  overidding dev memory and cpu limits to make it match with standard limits
#  https://github.com/hmcts/chart-java/blob/master/java/values.yaml
  devmemoryRequests: 1024Mi
  devcpuRequests: 250m
  devmemoryLimits: 2048Mi
  devcpuLimits: 1500m
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  environment:
    ENABLE_CACHE: none
    JWT_ISSUER_VALIDATION_ENABLED: true
    IDAM_SECURITY_ALLOWED_ISSUERS_0: https://idam-web-public.aat.platform.hmcts.net/o
    IDAM_SECURITY_ALLOWED_ISSUERS_1: https://hmcts-access.aat.platform.hmcts.net/o
    IDAM_SECURITY_ALLOWED_ISSUERS_2: https://forgerock-am.service.core-compute-idam-aat2.internal:8443/openam/oauth2/realms/root/realms/hmcts
    TESTING_SUPPORT_ENABLED: true
